# spindle configuration — copy to one of:
#   $SPINDLE_CONFIG                      (explicit override)
#   ~/.config/spindle/config.toml        (default location)
# or run /spindle:configure in Claude Code and describe what you want.
#
# Every key is optional; anything omitted falls back to the built-in default.
# The tool works with no config file at all.

# ── Acquisition mode ───────────────────────────────────────────────────────
# "scraper" → RSS/Atom + Hacker News + Lobsters + Reddit   (no keys needed)
# "api"     → NewsAPI + GNews + DEV.to + Hacker News + Lobsters
# The two are mutually exclusive. Try one once with `/spindle:refresh api`.
mode = "scraper"

# ── Cache & rendering ──────────────────────────────────────────────────────
ttl_minutes      = 30       # cache is "stale" after this; triggers a background refresh
max_stories      = 60       # cap on stories kept in the cache
max_age_hours    = 72       # drop stories older than this
history_size     = 800      # how many shown-story ids to remember (rotation)
pool_size        = 14       # verbs placed into settings per session
max_title_width  = 90       # display columns budget for the whole verb (tag + headline)
display_separator = ": "    # between topic tag and headline, e.g. "IOS: SwiftUI …"

# ── Networking ─────────────────────────────────────────────────────────────
request_timeout_secs = 8.0
max_feed_bytes       = 5000000
user_agent           = "spindle/0.2 (+https://github.com/IzhanAli/Spindle-for-CC)"

# Summaries for the Desktop story pane come from each story's feed. For a story
# whose feed has none (most Hacker News, Lobsters and Reddit links), the
# background refresh reads the top of the article's page once and keeps the
# description the publisher wrote for link previews (og:description). That is a
# request to the article's own site; set false to stick to the feeds.
page_summaries = true

# ── Locations ──────────────────────────────────────────────────────────────
# cache_dir            = "~/.cache/spindle"
claude_settings_path = "~/.claude/settings.json"   # where spinnerVerbs is written

# ── Headline cleaning ───────────────────────────────────────────────────────
# Every headline is rewritten by the plugin's `headline-writer` agent into a
# short spinner label that fits `max_title_width`. It runs through your own
# Claude Code login as headless `claude -p` calls during refresh (no tools, no
# MCP, no hooks), and results are cached — a story is cleaned once, never at
# render time. No API key needed.
#
# Cleaning is mandatory: only cleaned headlines reach the spinner. Stories the
# agent hasn't cleaned yet (e.g. `claude` unavailable, a failed call) wait for
# the next refresh; raw feed titles are never shown.
[ai]
model        = ""                         # empty → the agent's model (haiku)
claude_bin   = ""                         # empty → `claude` on PATH
max_words    = 24                         # target length of each label
batch_size   = 20                         # headlines per agent call (run in parallel)
timeout_secs = 120.0                      # per agent call

# ── Topics (relevance scoring; NewsAPI/GNews titles matching no topic or ────
#    built-in dev/AI keyword are dropped as off topic)
topics = [
  "Mobile", "iOS", "Android", "Swift", "SwiftUI", "Kotlin",
  "Jetpack Compose", "Flutter", "React Native", "Expo",
  "App Store", "Play Store",
  "AI", "LLMs", "Programming", "Open Source", "DevOps",
  "Python", "Java", "JavaScript", "Cloud", "Databases",
]

# ── Scoring weights ─────────────────────────────────────────────────────────
[weights]
freshness     = 1.0
signal        = 1.0   # HN / Lobsters points, Reddit score (log-scaled)
dev_relevance = 0.8   # mobile / programming keyword match
ai_relevance  = 0.6   # AI / LLM keyword match
release       = 0.6   # SDK / framework release & changelog posts

# ── Per-source weight (score multiplier, keyed by a story's `source`) ────────
# A source not listed here is 1.0 (neutral). Raise one to make it lead the
# ranking without silencing the rest. Sources: hackernews, lobsters (both
# modes); reddit, rss (scraper mode); newsapi, gnews, devto (api mode).
[source_weights]
devto = 2.0   # DEV.to leads the ranking

# ── Hacker News (front page via Algolia, no auth) ───────────────────────────
[hackernews]
enabled    = true
prefix     = "HN"
min_points = 80
limit      = 30

# ── Lobsters (hottest stories, public JSON, no auth; both modes) ────────────
[lobsters]
enabled   = true
prefix    = "LOB"
min_score = 15
limit     = 25                   # hottest.json holds 25 stories

# ── Reddit (public hot.json, no auth) ───────────────────────────────────────
[reddit]
enabled    = true
prefix     = "RDT"
min_score  = 100
limit      = 20
subreddits = [
  "androiddev", "iOSProgramming", "reactnative", "FlutterDev",
  "Kotlin", "swift",
  "programming", "javascript", "MachineLearning", "LocalLLaMA",
]

# ════════════════════════════════════════════════════════════════════════════
#  API MODE SOURCES  (used only when mode = "api")
# ════════════════════════════════════════════════════════════════════════════
# API keys: put them here OR (preferred, keeps secrets out of files) export
#   export NEWSAPI_KEY="..."      # https://newsapi.org/register
#   export GNEWS_KEY="..."        # https://gnews.io/  (free tier: 90 req/day)
# A keyed source with no key is simply skipped, so api mode still works on
# DEV.to + Hacker News alone. `daily_limit` is enforced — we never exceed it.

# `query` left empty is built automatically from `[topics]` (priority-ordered,
# OR-joined, quoted phrases, capped to each API's limit — GNews 200 / NewsAPI
# 500 chars). Set an explicit string to override and search exactly that.
[newsapi]
enabled     = true
prefix      = "NEWS"
api_key     = ""                 # or $NEWSAPI_KEY
query       = ""                 # empty → derived from [topics]
search_in   = "title,description" # adding "content" matches boilerplate on unrelated stories
language    = "en"
page_size   = 30
daily_limit = 100                # NewsAPI free tier

[gnews]
enabled     = true
prefix      = "GNEWS"
api_key     = ""                 # or $GNEWS_KEY
query       = ""                 # empty → derived from [topics]
lang        = "en"
max         = 10                 # free tier: max 10 articles/request
daily_limit = 90                 # GNews free tier: 90 requests/day

[devto]
enabled       = true
prefix        = "DEV"
min_reactions = 10
per_page      = 15
top_days      = 7                # top articles of the last N days
tags          = ["android", "ios", "flutter", "reactnative", "kotlin", "swift", "ai", "programming"]

